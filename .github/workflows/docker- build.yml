name: CI/CD Pipeline - Build and Push to Docker Hub

# 1. When does this run? Every time you push to the 'main' branch.
on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    # 2. Get the code from the GitHub repository
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 3. Log into Docker Hub using the secrets we created
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # 4. Set up Docker Buildx (required for advanced building)
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # 5. Build the Docker image and Push it to Docker Hub
    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        # Replace 'yourusername' below with your actual Docker Hub username!
        tags: shishirkulal26/antigravity-app:latest