name: CI/CD Pipeline - Build and Push to Docker Hub

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Set up Docker Buildx (best practice to put this before login)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Log into Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. Build and Push Docker Image
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Dynamically uses your secret username so the image tag matches your login
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/antigravity-app:latest